# Comfort tuning for volkswagen.
# Temperatures are in millidegrees Celsius; sampling is in milliseconds.
# CPU caps are in kHz, in Silver, Gold, Titanium, Prime topology order.
# GPU caps are in Hz.
# The final Prime cap replaces core pause with a 960 MHz frequency limit.
# Battery policy and compiled failsafes remain unchanged.

[comfort-cpu-front]
algo_type monitor
sampling 1000
sensor shell_front
thresholds 33000 37000 41000 45000
thresholds_clr 31000 35000 39000 43000
actions cpu-cluster0+cpu-cluster1+cpu-cluster2+cpu-cluster3 cpu-cluster0+cpu-cluster1+cpu-cluster2+cpu-cluster3 cpu-cluster0+cpu-cluster1+cpu-cluster2+cpu-cluster3 cpu-cluster0+cpu-cluster1+cpu-cluster2+cpu-cluster3
action_info 1286400+2208000+2208000+1670400 1286400+1920000+1920000+1478400 883200+1286400+1286400+1094400 748800+940800+940800+960000

